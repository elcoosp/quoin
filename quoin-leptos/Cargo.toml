[package]
readme = "../README.md"
name = "quoin-leptos"
keywords = ["reactive", "leptos", "ui", "state", "framework"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Leptos adapter for quoin reactive abstraction"
license.workspace = true
repository.workspace = true

[dependencies]
quoin-core = { path = "../quoin-core", default-features = false, features = ["leptos"] }

futures = { version = "0.3", features = ["executor"] }
leptos = { version = "0.9.0-rc1" }
send_wrapper = "0.6"
web-sys = { version = "0.3", features = ["Window", "Navigator", "Clipboard"] }
leptos-shadcn-ui = { git = "https://github.com/harana-oss/leptos-shadcn-ui", rev = "b16956f25868b369100178e06f6c5b0afd7eb2be", default-features = false, features = [
            "button",
            "input",
            "label",
            "textarea",
            "tabs",
            "badge",
            "table",
            "tooltip",
            "scroll-area",
            "dropdown-menu",
            "card",
            "alert",
            "alert-dialog",
            "accordion",
            "dialog",
            "popover",
            "collapsible",
            "separator",
            "checkbox",
            "switch",
            "radio-group",
            "slider",
            "progress",
            "skeleton",
            "toggle",
            "spinner",
            "kbd",
            "avatar",
        ], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[dev-dependencies]
quoin-conformance = { path = "../quoin-conformance", features = ["leptos"] }
futures-timer = "3.0"
[features]
shadcn = [
    "dep:leptos-shadcn-ui",
]

[lints]
workspace = true
