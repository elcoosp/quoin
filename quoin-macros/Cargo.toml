[package]
documentation = "https://quoin-docs.vercel.app"

license = "MIT"
repository = "https://github.com/elcoosp/quoin"
readme = "../README.md"
name = "quoin-macros"
keywords = ["reactive", "macro", "ui", "codegen", "derive"]
version.workspace = true
description = "Proc-macro entry points for the quoin declarative UI macros"
edition.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full", "parsing", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
quoin-macros-core = { path = "../quoin-macros-core" }

[dev-dependencies]
trybuild = "1.0"
quoin-macros-core = { path = "../quoin-macros-core" }

[features]
default = []
gpui = ["quoin-macros-core/gpui"]
dioxus = ["quoin-macros-core/dioxus"]
leptos = ["quoin-macros-core/leptos"]
floem = ["quoin-macros-core/floem"]
xilem = ["quoin-macros-core/xilem"]
leptos-shadcn = ["quoin-macros-core/leptos-shadcn"]
dioxus-shadcn = ["quoin-macros-core/dioxus-shadcn"]
floem-shadcn = ["quoin-macros-core/floem-shadcn"]
gpui-rsx-classes = ["quoin-macros-core/gpui-rsx-classes"]

[lints]
workspace = true
