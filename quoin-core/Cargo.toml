[package]
name = "quoin-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A foundational reactive abstraction layer for Rust UI frameworks"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["reactive", "ui", "framework", "abstraction", "signals"]
categories = ["gui", "asynchronous", "rust-patterns"]

[dependencies]
futures-core = "0.3"
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
send_wrapper = "0.6"
# Native fallback timer for `Executor::sleep` (background timer thread,
# no ambient async runtime required).
futures-timer = "3.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
trybuild = "1.0"
futures = "0.3"

[features]
default = []
gpui = []
dioxus = []
leptos = []
xilem = []
floem = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
# Browser timer backing `Executor::sleep` on wasm.
gloo-timers = { version = "0.3", features = ["futures"] }
# `keys { .. }` window-listener runtime (the web backends' shared matcher
# and attach path, see `keys.rs`): DOM keyboard events on the browser window.
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "EventTarget", "KeyboardEvent", "Event"] }

[lints]
workspace = true
