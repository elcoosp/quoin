[package]
name = "quoin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Facade crate for the quoin reactive ecosystem: one reactive core, many frameworks"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["reactive", "signals", "ui", "state", "framework"]
categories = ["gui", "asynchronous", "rust-patterns"]

[dependencies]
quoin-core = { path = "../quoin-core" }
futures-core = "0.3"

# Adapter crates (optional, pulled in by feature flags)
quoin-gpui      = { path = "../quoin-gpui",      optional = true }
quoin-dioxus    = { path = "../quoin-dioxus",    optional = true }
quoin-leptos    = { path = "../quoin-leptos",    optional = true }
quoin-xilem     = { path = "../quoin-xilem",     optional = true }
quoin-floem     = { path = "../quoin-floem",     optional = true }

# Macro crate (optional)
quoin-macros    = { path = "../quoin-macros",    optional = true }

# gpui-rsx proc-macro shell (rsx!, rsx_strict!, #[component], …). Pure token
# machinery (its core has no GPUI dependency), re-exported as the escape hatch
# for GPUI-only subtrees — see `docs/gpui-rsx-classes.md`.
gpui-rsx = { version = "0.12.0", optional = true }

# UCP crates (optional)
quoin-ui        = { path = "../quoin-ui",        optional = true }
quoin-ui-gpui   = { path = "../quoin-ui-gpui",   optional = true }

# Testing & devtools (optional)
quoin-testkit   = { path = "../quoin-testkit",   optional = true }
quoin-devtools  = { path = "../quoin-devtools",  optional = true }

gpui = { package = "gpui-pre", version = "=0.3.12", optional = true }
[features]
default = []
# The GPUI adapter ships the full gpui-rsx class engine by default
# (`gpui-rsx-classes` is implied — no second feature flag to remember): the
# extended Tailwind palette, extra state variants and dynamic `class:`
# expressions are part of the GPUI experience, and strict-mode diagnostics
# stay compile errors either way. The standalone `gpui-rsx-classes` flag
# remains for `macros`-without-framework users.
gpui   = ["dep:gpui", "dep:quoin-gpui", "dep:quoin-ui-gpui", "dep:quoin-macros", "quoin-macros?/gpui", "rsx", "gpui-rsx-classes"]
dioxus = ["dep:quoin-dioxus", "dep:quoin-macros", "quoin-macros?/dioxus"]
leptos = ["dep:quoin-leptos", "dep:quoin-macros", "quoin-macros?/leptos"]
xilem  = ["dep:quoin-xilem", "dep:quoin-macros", "quoin-macros?/xilem"]
floem  = ["dep:quoin-floem", "dep:quoin-macros", "quoin-macros?/floem"]
macros = ["dep:quoin-macros"]
ui     = ["dep:quoin-ui"]
# gpui-rsx escape hatch: re-exports rsx! / rsx_strict! / rsx_permissive! /
# rsx_fragment! / rsx_expand! / #[component] for GPUI-only subtrees inside
# quoin_render! render blocks (migration report §5, Option C). Enabled
# automatically by the `gpui` feature; standalone for raw-macro users.
rsx = ["dep:gpui-rsx"]
# Phase 1 of the gpui-rsx class-engine migration (docs/gpui-rsx-classes.md):
# forward the flag to the macro crates. Requires `macros` (or any framework
# feature) so the macro crate is actually in the graph.
gpui-rsx-classes = ["dep:quoin-macros", "quoin-macros?/gpui-rsx-classes"]
# Testing & devtools re-exports
testkit   = ["dep:quoin-testkit"]
devtools  = ["dep:quoin-devtools"]

# shadcn component backing — use together with the framework feature.
# e.g. features = ["leptos", "leptos-shadcn"]
# This activates the shadcn feature on the adapter crate so the component
# deps are resolved, AND tells the macro emitter to target shadcn components.
leptos-shadcn = [
    "leptos",
    "quoin-leptos?/shadcn",
    "quoin-macros?/leptos-shadcn",
]
dioxus-shadcn = [
    "dioxus",
    "quoin-dioxus?/shadcn",
    "quoin-macros?/dioxus-shadcn",
]
# Floem shadcn backing — standalone sibling checkout (../floem-shadcn, v0.2.0),
# the same "one flag" pattern: adapter gets the component dep, the macro
# emitter switches lowering.
floem-shadcn = [
    "floem",
    "quoin-floem?/shadcn",
    "quoin-macros?/floem-shadcn",
]

[lints]
workspace = true
