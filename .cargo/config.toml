# Workspace cargo configuration.
#
# The trybuild-driven macro UI tests link GPUI's keyboard stack, whose
# `xkbcommon` crate declares `#[link(name = "xkbcommon")]` and
# `#[link(name = "xkbcommon-x11")]`. This environment ships the runtime
# libraries but not their dev packages, so the extracted .deb payloads under
# ~/.local/opt/xkb provide the `libxkbcommon.so` / `libxkbcommon-x11.so`
# linker names.
#
# `[build] rustflags` (not the RUSTFLAGS env var) is used on purpose:
# `cargo test` strips RUSTFLAGS from the environment of spawned test
# binaries, so an env-based flag would never reach the trybuild-orchestrated
# inner cargo. A config-file flag is discovered by that inner cargo as it
# walks up from its target/tests/trybuild working directory.
[build]
rustflags = ["-L", "native=/home/z/.local/opt/xkb/usr/lib/x86_64-linux-gnu"]
