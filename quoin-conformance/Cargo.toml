[package]
publish = false
name = "quoin-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Conformance test suite for quoin reactive framework adapters"
license.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
quoin-core = { path = "../quoin-core", default-features = false }
futures = "0.3"

# Optional dependencies for specific adapters
# gpui-pre is zed's gpui published to crates.io; pinning it here keeps the
# GPUI test builds reproducible and avoids a 500 MB git checkout.
gpui = { package = "gpui-pre", version = "=0.3.12", optional = true }

[dev-dependencies]
quoin-testkit = { path = "../quoin-testkit" }

[features]
leptos = []
gpui   = ["dep:gpui"]
dioxus = []
xilem  = []
floem  = []
[lib]
name = "quoin_conformance"
path = "src/lib.rs"

[lints]
workspace = true
