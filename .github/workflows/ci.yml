name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

# Cancel superseded runs on the same branch/PR to save compute.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------
  # Format + clippy for the framework-free crates (fast feedback)
  # -----------------------------------------------------------------------
  check:
    name: Format & Lint (framework-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (framework-free crates)
        run: |
          cargo clippy --all-targets -p quoin-core -p quoin-macros-core \
            -p quoin-macros -p quoin-ui -p quoin-conformance \
            -p quoin-testkit -p quoin-devtools -- -D warnings

  # -----------------------------------------------------------------------
  # Core + facade tests (fast, no framework dependencies)
  # -----------------------------------------------------------------------
  test-core:
    name: Test Core
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run core + tooling tests
        run: |
          cargo nextest run -p quoin-core -p quoin-macros-core -p quoin-conformance \
            -p quoin-testkit -p quoin-devtools

      - name: Run facade tests
        run: cargo nextest run -p quoin

      - name: Run headless e2e examples
        run: cargo nextest run -p todo-core -p fetch-core -p devtools-demo

      - name: Run doctests
        run: cargo test --doc -p quoin-core -p quoin-testkit -p quoin-devtools

  # -----------------------------------------------------------------------
  # Adapter tests (one job per framework — heavy crates compile in parallel)
  # -----------------------------------------------------------------------
  test-adapters:
    name: Test ${{ matrix.framework }}
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: Leptos
            package: quoin-leptos
          - framework: Dioxus
            package: quoin-dioxus
          - framework: Xilem
            package: quoin-xilem
          - framework: Floem
            package: quoin-floem
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.package }}

      - name: Run tests
        run: cargo nextest run -p ${{ matrix.package }}

  # -----------------------------------------------------------------------
  # Macro UI tests (trybuild) — one per framework feature
  # -----------------------------------------------------------------------
  test-macros:
    name: Macro UI Tests (${{ matrix.framework }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: Leptos
            features: leptos
          - framework: Dioxus
            features: dioxus
          - framework: GPUI
            features: gpui
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install GPUI system dependencies
        if: matrix.features == 'gpui'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: macros-${{ matrix.features }}

      - name: Run macro UI tests
        run: cargo nextest run -p quoin-macros-tests --features ${{ matrix.features }}

  # -----------------------------------------------------------------------
  # Zero-overhead + parity gates (expansion gate, allocation gate,
  # semantic golden, widget parity matrix) for the Floem and Xilem backends
  # -----------------------------------------------------------------------
  gates-floem-xilem:
    name: Zero-overhead & parity gates (${{ matrix.backend }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: floem
          - backend: xilem
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: gates-${{ matrix.backend }}

      - name: Expansion gate (single backend)
        run: cargo nextest run -p quoin-macros-core --features ${{ matrix.backend }} --test ${{ matrix.backend }}_expansion

      - name: Parity matrix + semantic golden (shared IR)
        run: cargo nextest run -p quoin-style

      - name: Parity matrix (both dynamic backends)
        if: matrix.backend == 'xilem'
        run: cargo nextest run -p quoin-macros-core --features floem,xilem --test parity_matrix

      - name: Allocation gate (Xilem only)
        if: matrix.backend == 'xilem'
        run: cargo nextest run -p quoin-xilem --test allocation_gate

  # -----------------------------------------------------------------------
  # GPUI tests — requires Linux system libraries
  # -----------------------------------------------------------------------
  test-gpui:
    name: Test GPUI
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libx11-dev \
            libxcb1-dev \
            libwayland-dev \
            libfontconfig1-dev \
            libssl-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: gpui

      - name: Clippy (GPUI crates)
        run: cargo clippy --all-targets -p quoin-gpui -p quoin-ui-gpui -- -D warnings

      - name: Run GPUI adapter tests
        run: cargo nextest run -p quoin-gpui

      - name: Run GPUI conformance tests
        run: cargo nextest run -p quoin-conformance --features gpui

      - name: Run GPUI macro UI tests
        run: cargo nextest run -p quoin-macros-tests --features gpui

  # -----------------------------------------------------------------------
  # Compile-check all examples (no windows opened)
  # -----------------------------------------------------------------------
  build-examples:
    name: Build Examples
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libx11-dev \
            libxcb1-dev \
            libwayland-dev \
            libfontconfig1-dev \
            libssl-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: examples

      - name: Build all examples
        run: just build-examples
