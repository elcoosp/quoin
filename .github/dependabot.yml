version: 2
updates:
  # Workspace crates: bump Cargo.lock versions and manifest requirements.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  # Standalone example workspaces (excluded from the root workspace) manage
  # their own manifests and lockfiles.
  - package-ecosystem: cargo
    directory: /examples/counter-gpui
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: cargo
    directory: /examples/counter-dioxus
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: cargo
    directory: /examples/counter-leptos
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: cargo
    directory: /examples/counter-floem
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: cargo
    directory: /examples/counter-xilem
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: cargo
    directory: /examples/ucp-lib
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  # Keep the CI actions current (checkout, rust-toolchain, rust-cache, ...).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
