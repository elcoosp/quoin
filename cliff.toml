# git-cliff configuration for quoin
#
# Generates a Keep a Changelog–style CHANGELOG.md from Conventional Commits.
# Usage:
#   git cliff -o CHANGELOG.md            # full changelog
#   git cliff --unreleased -u -o ...     # only the unreleased section
# See https://git-cliff.org/docs for all options.

[changelog]
# A new section (version) is created for each tag / release.
header = """# Changelog

All notable changes to Quoin will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
# Template for the whole changelog body (version sections rendered by `version` template below).
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% if previous.version -%}
[Diff against {{ previous.version }}](https://github.com/elcoosp/quoin/compare/{{ previous.version }}...{{ version }})
{% endif -%}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits -%}
{% if commit.scope -%}
- **{{ commit.scope }}**: {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/elcoosp/quoin/commit/{{ commit.id }}))
{% else -%}
- {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/elcoosp/quoin/commit/{{ commit.id }}))
{% endif -%}
{% endfor %}{% endfor %}\n
"""
# Remove leading/trailing whitespace from the final output.
trim = true
# Render a changelog when a new tag is created, even with no commits since the previous tag.
footer = "<!-- generated by git-cliff -->"
postprocessors = []

[git]
# Parse commits according to the Conventional Commits specification.
conventional_commits = true
# Exclude commits that do not parse as conventional commits.
filter_unconventional = true
# Split commits by newline (one commit per line in the log).
split_commits = false
# Commit ordering: newest first within a version section.
topo_order = false
# Order commits by date instead of topological order.
commit_parsers = [
    { message = "^feat", group = "🚀 Added – New features and capabilities" },
    { message = "^fix", group = "🔧 Fixed – Bug fixes and corrections" },
    { message = "^perf", group = "⚡ Performance – Optimizations and improvements" },
    { message = "^refactor", group = "♻️ Changed – Refactoring" },
    { message = "^doc", group = "📚 Documentation – Documentation changes" },
    { message = "^test", group = "🧪 Tests – Test additions and changes" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps\\)", skip = true },
    { message = "^chore\\(pr\\)", skip = true },
    { message = "^chore\\(pull\\)", skip = true },
    { message = "^chore", group = "🧹 Cleanup – Code maintenance and housekeeping" },
    { message = "^style", group = "🎨 Style – Code style changes" },
    { message = "^revert", group = "↩️ Reverted – Reverted changes" },
    { message = "^ci", group = "👷 CI – Continuous integration" },
    { message = "^build", group = "📦 Build – Build system and dependencies" },
]
# Protect breaking changes from being skipped by commit parsers.
protect_breaking_commits = true
# Filter out commits that were skipped by a commit parser.
filter_commits = true
# Regex to match the tags used by git-cliff to determine versions.
tag_pattern = "v[0-9].*"
# Ignore tags that do not match the pattern.
ignore_tags = ""
# Include tags in the changelog output.
topo_order_commits_display = false
