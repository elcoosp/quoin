[package]
name = "quoin-floem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Floem adapter for quoin reactive abstraction"
license.workspace = true
repository.workspace = true

[dependencies]
quoin-core = { path = "../quoin-core", default-features = false }
floem = "0.2.0"
floem_reactive = "0.2.0"
futures = "0.3"
futures-timer = "3.0"
send_wrapper = "0.6"

[dev-dependencies]
quoin-conformance = { path = "../quoin-conformance", features = ["floem"] }
