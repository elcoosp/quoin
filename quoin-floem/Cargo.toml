[package]
name = "quoin-floem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Floem adapter for quoin reactive abstraction"
license.workspace = true
repository.workspace = true

[dependencies]
quoin-core = { path = "../quoin-core", default-features = false }
quoin-style = { path = "../quoin-style" }
floem = { git = "https://github.com/lapce/floem", branch = "main" }
floem_reactive = { git = "https://github.com/lapce/floem", branch = "main" }
futures = "0.3"
futures-timer = "3.0"
send_wrapper = "0.6"

[dev-dependencies]
quoin-conformance = { path = "../quoin-conformance", features = ["floem"] }

[lints]
workspace = true
