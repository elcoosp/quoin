[package]
description = "The quoin-expand-test crate for the quoin ecosystem"
license = "MIT"
repository = "https://github.com/elcoosp/quoin"
readme = "../README.md"
name = "quoin-expand-test"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = "0.9.0-rc1"
quoin = { git = "https://github.com/elcoosp/quoin", features = ["leptos"] }
quoin-macros = { path = "../quoin-macros", features = ["leptos"] }

[features]
leptos = ["quoin/leptos", "quoin-macros/leptos"]
