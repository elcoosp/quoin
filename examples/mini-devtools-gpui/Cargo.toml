[package]
name = "mini-devtools-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
quoin = { path = "../../quoin", features = ["gpui"] }
quoin-ui = { path = "../../quoin-ui" }
ucp-lib = { path = "../ucp-lib", features = ["gpui"] }
quoin-macros = { path = "../../quoin-macros", features = ["gpui"] }
