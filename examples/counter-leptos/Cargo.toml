[package]
publish = false
name = "counter-leptos"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
leptos = "0.9.0-rc1"
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"
wasm-bindgen = "0.2"
counter-lib = { path = "../counter" }
quoin = { git = "https://github.com/elcoosp/quoin", features = ["leptos"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.9.0-rc1", features = ["csr"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
leptos_axum = "0.9.0-rc1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs"] }

[package.metadata.leptos]
output-name = "counter-leptos"
site-root = "target/site"
assets-dir = "public"
bin-target = "server"
