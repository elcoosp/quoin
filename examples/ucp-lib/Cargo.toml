[package]
name = "ucp-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
quoin = { git = "https://github.com/elcoosp/quoin" }
quoin-macros = { path = "../../quoin-macros" }
quoin-ui = { path = "../../quoin-ui" }

# Framework-specific dependencies (optional)
gpui = { git = "https://github.com/zed-industries/zed", optional = true }
leptos = { version = "0.9.0-rc1", optional = true }
dioxus = { version = "0.7", optional = true }
dioxus-core = { version = "0.7", optional = true }
dioxus-signals = { version = "0.7", optional = true }

# Add shadcn dependency - only needed when leptos is enabled
leptos-shadcn-ui = { git = "https://github.com/harana-oss/leptos-shadcn-ui", rev = "b16956f25868b369100178e06f6c5b0afd7eb2be", optional = true, default-features = false, features = ["button", "input", "tabs", "badge", "table", "tooltip", "scroll-area", "dropdown-menu"] }

[features]
gpui   = ["dep:gpui", "quoin/gpui", "quoin-macros/gpui"]
leptos = ["dep:leptos", "quoin/leptos", "quoin-macros/leptos"]
leptos-shadcn = ["leptos", "dep:leptos-shadcn-ui", "quoin/leptos-shadcn", "quoin-macros/leptos-shadcn"]
dioxus = ["dep:dioxus", "dep:dioxus-core", "dep:dioxus-signals", "quoin/dioxus", "quoin-macros/dioxus"]

# Required: `leptos-shadcn-ui` depends on patched crates.io crates carried in
# the harana-oss fork (leptos 0.9.0-rc1); `[patch]` in a git dependency is
# ignored by cargo. Patched against rev b16956f of that fork.
[patch.crates-io]
leptos-node-ref = { git = "https://github.com/harana-oss/leptos-shadcn-ui", rev = "b16956f25868b369100178e06f6c5b0afd7eb2be" }
leptos-style = { git = "https://github.com/harana-oss/leptos-shadcn-ui", rev = "b16956f25868b369100178e06f6c5b0afd7eb2be" }
leptos-struct-component = { git = "https://github.com/harana-oss/leptos-shadcn-ui", rev = "b16956f25868b369100178e06f6c5b0afd7eb2be" }
