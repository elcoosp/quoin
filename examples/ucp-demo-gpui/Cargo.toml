# examples/ucp-demo/Cargo.toml
[package]
name = "ucp-demo-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
quoin = { path = "../../quoin", features = ["gpui"] }
ucp-lib = { path = "../ucp-lib", features = ["gpui"] }
