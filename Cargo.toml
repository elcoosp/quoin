[workspace]
resolver = "2"
members = [
    "examples/counter",
    "examples/todo-core",
    "examples/fetch-core",
    "examples/devtools-demo",
    "quoin-leptos",
    "quoin-dioxus",
    "quoin-gpui",
    "quoin-xilem",
    "quoin-floem",
    "quoin-conformance",
    "quoin-core",
    "quoin",
    "quoin-macros",
    "quoin-macros-core",
    "quoin-macros-tests",
    "quoin-ui",
    "quoin-ui-gpui",
    "quoin-testkit",
    "quoin-devtools",
]
exclude = [
    "examples/counter-dioxus",
    "examples/counter-gpui",
    "examples/counter-leptos",
    "examples/counter-floem",
    "examples/counter-xilem",
    "examples/ucp-demo-dioxus",
    "examples/ucp-demo-gpui",
    "examples/ucp-demo-leptos",
    "examples/ucp-lib",
    "examples/mini-devtools-gpui",
    "examples/ucp-demo-leptos-shadcn",
    "quoin-expand-test",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/elcoosp/quoin"

# Central lint policy: every workspace crate inherits this via
# `[lints] workspace = true`. Pedantic is enabled and `allow` attributes are
# banned outright (`clippy::allow_attributes`), so issues are fixed at the
# source instead of suppressed. CI runs with `-D warnings`, turning every
# warning below into a hard error.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes = "deny"

[[workspace.metadata.leptos]]
name = "counter-leptos"
bin-package = "counter-leptos"
lib-package = "counter-leptos"
site-root = "examples/counter-leptos/target/site"
