[workspace]
resolver = "2"
members = [
    "examples/counter",
    "examples/todo-core",
    "examples/fetch-core",
    "examples/devtools-demo",
    "quoin-leptos",
    "quoin-dioxus",
    "quoin-gpui",
    "quoin-xilem",
    "quoin-floem",
    "quoin-conformance",
    "quoin-core",
    "quoin",
    "quoin-macros",
    "quoin-macros-core",
    "quoin-macros-tests",
    "quoin-style",
    "quoin-ui",
    "quoin-ui-gpui",
    "quoin-testkit",
    "quoin-devtools",
    "interop-tests",
    "quoin-grsx-compiletest",
    "third_party/gpui-stub",
    "third_party/gpui-stub-macros",
]
exclude = [
    "examples/counter-dioxus",
    "examples/counter-gpui",
    "examples/counter-leptos",
    "examples/counter-floem",
    "examples/todo-floem",
    "examples/counter-xilem",
    "examples/ucp-demo-dioxus",
    "examples/ucp-demo-gpui",
    "examples/ucp-demo-leptos",
    "examples/ucp-lib",
    "examples/mini-devtools-gpui",
    "examples/ucp-demo-leptos-shadcn",
    "quoin-expand-test",
]
# Rich-elements Phase 2 note: `floem-shadcn` is no longer vendored under
# third_party/. It is a standalone sibling checkout (the same modified tree
# the floem-shadcn zip carries) consumed as a path dependency by
# `quoin-floem` — see that crate's manifest for the layout contract.

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/elcoosp/quoin"

# Central lint policy: every workspace crate inherits this via
# `[lints] workspace = true`. Pedantic is enabled and `allow` attributes are
# banned outright (`clippy::allow_attributes`), so issues are fixed at the
# source instead of suppressed. CI runs with `-D warnings`, turning every
# warning below into a hard error.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes = "deny"

# `leptos-shadcn-ui` (git dependency, leptos 0.9.0-rc1 support) relies on patched
# versions of these crates. `[patch]` sections in a git dependency are ignored by
# cargo, so they must be re-declared here for the fork's vendored fixes to apply.
# Patched against https://github.com/harana-oss/leptos-shadcn-ui rev b16956f.
[patch.crates-io]
leptos-node-ref = { git = "https://github.com/harana-oss/leptos-shadcn-ui", rev = "b16956f25868b369100178e06f6c5b0afd7eb2be" }
leptos-style = { git = "https://github.com/harana-oss/leptos-shadcn-ui", rev = "b16956f25868b369100178e06f6c5b0afd7eb2be" }
leptos-struct-component = { git = "https://github.com/harana-oss/leptos-shadcn-ui", rev = "b16956f25868b369100178e06f6c5b0afd7eb2be" }
# Floem's main branch depends on `muda` with the `gtk` feature on Linux,
# which requires the GTK 3 development files at build time. Quoin must build
# without system GTK, so `muda` is replaced by `third_party/muda-stub`: an
# API-compatible stand-in whose menu constructors work in memory but whose
# native-menu operations are runtime errors. Native menus are therefore
# unsupported on Linux in this configuration; see the stub's crate docs.
muda = { path = "third_party/muda-stub" }

[[workspace.metadata.leptos]]
name = "counter-leptos"
bin-package = "counter-leptos"
lib-package = "counter-leptos"
site-root = "examples/counter-leptos/target/site"
