[package]
name = "quoin-xilem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Xilem adapter for quoin reactive abstraction"
license.workspace = true
repository.workspace = true

[dependencies]
quoin-core = { path = "../quoin-core", default-features = false }
quoin-style = { path = "../quoin-style" }
xilem = { git = "https://github.com/linebender/xilem", branch = "main" }
xilem_core = { git = "https://github.com/linebender/xilem", branch = "main" }
futures = "0.3"
futures-timer = "3.0"
send_wrapper = "0.6"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
[dev-dependencies]
quoin-conformance = { path = "../quoin-conformance", features = ["xilem"] }
quoin-macros = { path = "../quoin-macros", features = ["xilem"] }
dhat = "0.3"

[lints]
workspace = true
