[package]
name = "quoin-macros-core"
version = "0.1.0"
edition = "2024"

[dependencies]
uuid = { version = "1.0", features = ["v4"] }
syn = { version = "3", features = ["full", "parsing", "extra-traits", "visit", "visit-mut"] }
quote = "1.0"
proc-macro2 = "1.0"
thiserror = "2.0"
quoin-style = { path = "../quoin-style" }
# gpui-rsx's class engine as a library (no GPUI dependency: syn/quote/proc-macro2
# only). Optional — pulled in by the `gpui-rsx-classes` feature. Pinned to the
# same 0.10.2 release whose tables are generated from quoin's pinned GPUI
# snapshot (gpui-pre 0.3.10); bump together with any gpui-pre bump.
gpui-rsx-core = { version = "0.12.0", optional = true }
# gpui-rsx-core is built on syn 2; quoin-macros-core uses syn 3. The rename
# lets both major versions coexist (needed for `generate_runtime_module`'s
# typed `&syn::Path` argument).
syn2 = { package = "syn", version = "2", optional = true }

# The framework features are pure `cfg` switches: the emitters *generate*
# framework code as token streams, they never link against the frameworks
# themselves. Keeping them dependency-free makes feature-gated clippy runs
# cheap and avoids pointless rebuilds of GPUI/Leptos/Dioxus.
[features]
default = []
gpui   = []
dioxus = []
floem  = []
xilem  = []
leptos = []
# When enabled, emitters produce shadcn component calls instead of plain HTML.
leptos-shadcn = []
dioxus-shadcn = []
# The Floem emitter lowers Tier-1/Tier-2 elements to `floem-shadcn` components
# (the standalone ../floem-shadcn sibling, v0.2.0) instead of the generic
# primitives. Pure emitter-level cfg: the generated code resolves
# `::floem_shadcn::…` in the consumer crate (quoin-floem enables the dep via
# its own `shadcn` feature).
floem-shadcn = []
# Phase 1 of the gpui-rsx migration (docs/gpui-rsx-classes.md): route unknown
# Tailwind classes on the GPUI backend through gpui-rsx's class engine, unlock
# the extended vocabulary, state variants, and dynamic `class:` values.
# Classes quoin already knows keep their byte-identical lowering.
gpui-rsx-classes = ["dep:gpui-rsx-core", "dep:syn2"]

# Expansion tests compile against a single backend's emitter; each needs its
# feature on or `render_floem` / `render_xilem` stay `#[cfg]`-ed out.
[[test]]
name = "floem_expansion"
required-features = ["floem"]

[[test]]
name = "floem_keys_expansion"
required-features = ["floem"]

[[test]]
name = "leptos_expansion"
required-features = ["leptos"]

[[test]]
name = "dioxus_expansion"
required-features = ["dioxus"]

[[test]]
name = "xilem_expansion"
required-features = ["xilem"]

[[test]]
name = "parity_matrix"
required-features = ["floem", "xilem"]

[[example]]
name = "bench-web-expansion"
required-features = ["leptos", "dioxus"]

[lints]
workspace = true
