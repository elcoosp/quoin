[package]
name = "quoin-macros-tests"
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"

[dependencies]
quoin = { path = "../quoin" }
quoin-macros = { path = "../quoin-macros" }

# GPUI is a feature, just like you want!
# gpui-pre is zed's gpui published to crates.io; using it (instead of the
# zed git repository) keeps the trybuild scratch builds reproducible and
# avoids a 500 MB git checkout per test run.
gpui = { package = "gpui-pre", version = "=0.3.12", optional = true }
quoin-gpui = { path = "../quoin-gpui", optional = true }
quoin-ui-gpui = { path = "../quoin-ui-gpui", optional = true }
gpui-component = { version = "0.8.1", optional = true }

leptos = { version = "0.9.0-rc1", optional = true }
quoin-leptos = { path = "../quoin-leptos", optional = true }

dioxus = { version = "0.7", optional = true }
dioxus-core = { version = "0.7", optional = true }
dioxus-signals = { version = "0.7", optional = true }
quoin-dioxus = { path = "../quoin-dioxus", optional = true }

[features]
default = []
gpui = ["dep:gpui", "dep:quoin-gpui", "dep:quoin-ui-gpui", "dep:gpui-component", "quoin-macros/gpui", "quoin/gpui"]
# Engine flag: run with `cargo test -p quoin-macros-tests --features gpui,gpui-rsx-classes`
# to compile the UI/expansion tests through the gpui-rsx-classes engine.
gpui-rsx-classes = ["quoin-macros/gpui-rsx-classes", "quoin/gpui-rsx-classes"]
leptos = ["dep:leptos", "dep:quoin-leptos", "quoin-macros/leptos", "quoin/leptos"]
dioxus = [
    "dep:dioxus",
    "dep:dioxus-core",
    "dep:dioxus-signals",
    "dep:quoin-dioxus",
    "quoin-macros/dioxus",
    "quoin/dioxus"
]

[dev-dependencies]
trybuild = "1.0"

[lints]
workspace = true
