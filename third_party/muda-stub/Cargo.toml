# API-compatible in-memory `muda` stand-in for Linux sandboxes / fresh
# clones.
#
# The workspace `[patch.crates-io]` in the root Cargo.toml patches `muda`
# against this directory so that quoin builds without GTK 3 development
# files (muda's `gtk` feature pulls them in on Linux).
#
# This version implements the menu API surface Floem exercises (menus,
# items, submenus, predefined items, accelerators, icons, events) as plain
# in-memory data structures, so `quoin-floem` and its examples compile.
# Native-menu attachment (`init_for_*`, `show_for_*`) returns
# `Error::NotSupported`: native menus remain unsupported on Linux in this
# configuration, matching the note in the root Cargo.toml.
[package]
name = "muda"
version = "0.17.1"
edition = "2021"
license = "MIT"
description = "In-memory API-compatible stub replacing muda when GTK is unavailable"

[lib]
path = "src/lib.rs"

# Accelerators parse against keyboard-types' Code/Modifiers, exactly like
# upstream muda 0.17. Pure Rust, no system dependencies.
[dependencies]
keyboard-types = "0.8"

# Floem depends on muda with `gtk` on Linux; the stub declares the feature
# (empty) so dependency resolution succeeds without GTK development files.
[features]
default = []
gtk = []
