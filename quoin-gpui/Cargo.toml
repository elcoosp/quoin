[package]
name = "quoin-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "GPUI adapter for quoin reactive abstraction"
license.workspace = true
repository.workspace = true

[dependencies]
quoin-core = { path = "../quoin-core" }
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed" }
futures = "0.3"
send_wrapper = "0.6"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }
quoin-conformance = { path = "../quoin-conformance", features = ["gpui"] }
